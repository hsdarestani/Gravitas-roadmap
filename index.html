<!DOCTYPE html>

<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#073b50" name="theme-color"/>
<meta content="نقشه‌ی راه توسعه‌ی Gravitas؛ رسانه، وب‌سایت، بازی‌های علمی و جامعه‌ای برای فهم عمیق‌تر علم." name="description"/>
<meta content="Gravitas — Roadmap" property="og:title"/>
<meta content="طرح اولیه‌ی توسعه‌ی Gravitas؛ از روایت علم تا بازی، یادگیری و کامیونیتی." property="og:description"/>
<meta content="website" property="og:type"/>
<title>Gravitas — Roadmap</title>
<link href="styles.css" rel="stylesheet"/>
</head>
<body>
<a class="skip-link" href="#slide-1">رفتن به محتوای سند</a>
<div aria-hidden="true" class="ambient">
<div class="field field--top"></div>
<div class="field field--bottom"></div>
<div class="orbit orbit--one"><i></i></div>
<div class="orbit orbit--two"><i></i></div>
<div class="grain"></div>
</div>
<header class="topbar">
<button aria-label="رفتن به جلد" class="brand" data-go="0" type="button">
<span class="brand__mark"><img alt="لوگوی Gravitas" src="logo.svg"/></span>
<span class="brand__copy">
<b>GRAVITAS</b>
<small>ROADMAP / 2026</small>
</span>
</button>
<div class="topbar__actions">
<button aria-label="چاپ یا ذخیره به‌صورت PDF" class="icon-button" id="printButton" title="نسخه‌ی چاپی" type="button">
<svg aria-hidden="true" viewbox="0 0 24 24"><path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"></path></svg>
</button>
<button aria-controls="indexPanel" aria-expanded="false" class="index-button" id="indexButton" type="button">
<span>فهرست</span><i></i><i></i>
</button>
</div>
</header>
<main aria-live="polite" class="deck" id="deck"></main>
<nav aria-label="کنترل اسلایدها" class="deck-nav">
<button aria-label="اسلاید قبلی" class="nav-arrow" id="prevButton" type="button">
<svg aria-hidden="true" viewbox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<div aria-hidden="true" class="deck-progress"><i id="progressBar"></i></div>
<div class="deck-count"><b id="currentNumber">01</b><span>/</span><span id="totalNumber">36</span></div>
<button aria-label="اسلاید بعدی" class="nav-arrow" id="nextButton" type="button">
<svg aria-hidden="true" viewbox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</nav>
<aside aria-hidden="true" class="index-panel" id="indexPanel">
<div class="index-panel__head">
<div><small>GRAVITAS</small><h2>فهرست سند</h2></div>
<button aria-label="بستن فهرست" class="index-close" id="indexClose" type="button">×</button>
</div>
<ol id="indexList"></ol>
<div class="index-panel__foot">
<span>کلیدهای ← و → برای حرکت</span>
<span>اسکرول و Swipe فعال است</span>
</div>
</aside>
<div class="panel-backdrop" id="panelBackdrop"></div>
<noscript><div class="noscript">برای ورق‌زدن این سند، JavaScript را فعال کنید.</div></noscript>
<script src="slides-data.js"></script><script src="script.js"></script>
</body>
</html>
